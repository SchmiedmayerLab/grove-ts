name: Build and Test

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:

jobs:
  reuse:
    name: REUSE Compliance Check
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@v0.5
  actionlint:
    name: GitHub Actions Workflow Check
    uses: SchmiedmayerLab/.github/.github/workflows/actionlint.yml@v0.5
  markdown-links:
    name: Markdown Link Check
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@v0.5
  fhir-draft:
    name: Draft FHIR Stack — Scoped Quality and Structural Conformance
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      startsWith(github.head_ref, 'feature/fhir-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Grove TypeScript
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The pin lives with the package that reads it, so CI and a local run agree.
      - name: Read the pinned Grove FHIR commit
        id: grove-fhir
        run: >-
          echo "sha=$(node -p "const p=require('./packages/fhir/grove-fhir.json');p.ref??p.sha")"
          >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned Grove FHIR commit
        uses: actions/checkout@v7
        with:
          repository: SchmiedmayerLab/grove-fhir
          ref: ${{ steps.grove-fhir.outputs.sha }}
          path: .build/grove-fhir
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Build shared lint configuration
        run: npm run build --workspace @schmiedmayerlab/grove-configurations
      - name: Check scoped formatting
        run: >-
          npm exec prettier -- --check
          packages/fhir
          .github/workflows/build-and-test.yml
          .github/workflows/fhir-conformance.yml
      - name: Check generated contracts and strict types
        run: |
          npm run check:catalog --workspace @schmiedmayerlab/grove-fhir
          npm run typecheck --workspace @schmiedmayerlab/grove-fhir
      - name: Lint and test the FHIR package
        run: |
          npm run lint:ci --workspace @schmiedmayerlab/grove-fhir
          npm test --workspace @schmiedmayerlab/grove-fhir
      - name: Check browser and deterministic fixtures
        run: |
          npm run test:browser --workspace @schmiedmayerlab/grove-fhir
          npm run check:fixtures --workspace @schmiedmayerlab/grove-fhir
      - name: Run producer-neutral structural conformance
        run: >-
          npm run conformance:structural --workspace @schmiedmayerlab/grove-fhir --
          --ig "$GITHUB_WORKSPACE/.build/grove-fhir"
  quality:
    name: Build and Quality Checks
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      !startsWith(github.head_ref, 'feature/fhir-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build packages with strict TypeScript checks
        run: npm run build
      - name: Lint packages
        run: npm run lint:ci
      - name: Analyze dead code, dependencies, exports, and cycles
        run: npm run analyze
      - name: Type-check source and tests
        run: npm run typecheck
      - name: Verify package contents
        run: npm run pack:check
      - name: Lint package manifests and TypeScript declarations
        run: npm run pack:lint
      - name: Audit all dependencies
        run: npm run audit
      - name: Verify npm registry signatures
        run: npm run audit:signatures
  node-current:
    name: Node.js 26 Compatibility
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      !startsWith(github.head_ref, 'feature/fhir-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Set up npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Type-check source and tests
        run: npm run typecheck
      - name: Run tests
        run: npm test
  documentation:
    name: Build Pages
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      !startsWith(github.head_ref, 'feature/fhir-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/design-system/docs/package-lock.json
      - name: Use the repository npm version
        run: |
          NPM_VERSION="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { packageManager } = JSON.parse(readFileSync("package.json", "utf8"));
            const match = /^npm@((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$/.exec(packageManager ?? "");
            if (!match) throw new Error("package.json must declare an exact npm packageManager version.");
            console.log(match[1]);
          ')"
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - name: Install dependencies
        run: npm ci
      - name: Build Pages artifact
        run: npm run pages:build
  tests:
    name: Test and Coverage
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      !startsWith(github.head_ref, 'feature/fhir-')
    uses: SchmiedmayerLab/.github/.github/workflows/npm-test-coverage.yml@v0.5
    with:
      coverage-files: >-
        packages/design-system/coverage/lcov.info,
        packages/firebase-cloud-messaging/coverage/lcov.info,
        packages/fhir/coverage/lcov.info,
        packages/firebase-utils/coverage/lcov.info
      npmVersion: '12.0.2'
    secrets:
      token: ${{ secrets.CODECOV_TOKEN }}
  tests-exact-head:
    name: Exact PR Head — Test and Coverage
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      !startsWith(github.head_ref, 'feature/fhir-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify the checked-out PR head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Run every package coverage gate on the exact head
        run: |
          npm run build
          npm run test:release
          npm run test:coverage
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
  draft-ci:
    name: Draft FHIR Stack — Scoped Checks (Not Release Readiness)
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      startsWith(github.head_ref, 'feature/fhir-')
    needs:
      - actionlint
      - dependency-review
      - fhir-draft
      - markdown-links
      - reuse
    runs-on: ubuntu-latest
    steps:
      - name: Check scoped draft jobs
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          FHIR_DRAFT_RESULT: ${{ needs.fhir-draft.result }}
          MARKDOWN_LINKS_RESULT: ${{ needs.markdown-links.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
        run: |
          for result in \
            "$ACTIONLINT_RESULT" \
            "$DEPENDENCY_REVIEW_RESULT" \
            "$FHIR_DRAFT_RESULT" \
            "$MARKDOWN_LINKS_RESULT" \
            "$REUSE_RESULT"; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done
  ci:
    name: CI — Full Release Readiness
    if: >-
      always() &&
      !(github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      startsWith(github.head_ref, 'feature/fhir-'))
    needs:
      - actionlint
      - dependency-review
      - documentation
      - fhir-draft
      - markdown-links
      - node-current
      - quality
      - reuse
      - tests
      - tests-exact-head
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          MARKDOWN_LINKS_RESULT: ${{ needs.markdown-links.result }}
          NODE_CURRENT_RESULT: ${{ needs.node-current.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          TESTS_EXACT_HEAD_RESULT: ${{ needs.tests-exact-head.result }}
        run: |
          for result in \
            "$ACTIONLINT_RESULT" \
            "$DOCUMENTATION_RESULT" \
            "$MARKDOWN_LINKS_RESULT" \
            "$NODE_CURRENT_RESULT" \
            "$QUALITY_RESULT" \
            "$REUSE_RESULT" \
            "$TESTS_RESULT" \
            "$TESTS_EXACT_HEAD_RESULT"; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done
          if [[ "${{ github.event_name }}" == pull_request && "$DEPENDENCY_REVIEW_RESULT" != success ]]; then
            exit 1
          fi
