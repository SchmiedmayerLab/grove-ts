name: Build and Test

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  reuse:
    name: REUSE Compliance Check
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@v0.5
  actionlint:
    name: GitHub Actions Workflow Check
    uses: SchmiedmayerLab/.github/.github/workflows/actionlint.yml@v0.5
  markdown-links:
    name: Markdown Link Check
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@v0.5
  quality:
    name: Build and Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Check formatting
        run: pnpm run format:check
      - name: Build packages with strict TypeScript checks
        run: pnpm run build
      - name: Lint packages
        run: pnpm run lint:ci
      - name: Analyze dead code, dependencies, exports, and cycles
        run: pnpm run analyze
      - name: Type-check source and tests
        run: pnpm run typecheck
      - name: Verify package contents
        run: pnpm run pack:check
      - name: Lint package manifests and TypeScript declarations
        run: pnpm run pack:lint
      - name: Audit all dependencies
        run: pnpm run audit
      - name: Verify registry signatures
        run: pnpm run audit:signatures
  node-current:
    name: Node.js 26 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Build packages
        run: pnpm run build
      - name: Type-check source and tests
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
  documentation:
    name: Build Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Build Pages artifact
        run: pnpm run pages:build
  tests:
    name: Test and Coverage
    uses: SchmiedmayerLab/.github/.github/workflows/npm-test-coverage.yml@e3709c19fb60fe94ea5e1f2e55e260dc7ccaaa73
    with:
      coverage-files: >-
        packages/design-system/coverage/lcov.info,
        packages/firebase-cloud-messaging/coverage/lcov.info,
        packages/fhir/coverage/lcov.info,
        packages/firebase-utils/coverage/lcov.info
    secrets:
      token: ${{ secrets.CODECOV_TOKEN }}
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          # Keep in sync with the exceptions in scripts/audit-dependencies.mjs.
          allow-ghsas: GHSA-g3hv-75wg-m249
  ci:
    name: CI
    if: always()
    needs:
      - actionlint
      - dependency-review
      - documentation
      - markdown-links
      - node-current
      - quality
      - reuse
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            exit 1
          fi
