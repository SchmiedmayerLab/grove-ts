name: Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packageVersion:
        description: Package version to publish, for example 0.1.0
        required: true
        type: string
      bootstrapWithToken:
        description: Create unpublished npm packages with the one-time NPM_TOKEN
        required: false
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
  publishpackage:
    name: Publish Package
    needs: build-and-test
    uses: SchmiedmayerLab/.github/.github/workflows/npm-publish.yml@v0.3
    permissions:
      contents: read
      id-token: write
    secrets:
      NPM_TOKEN: ${{ inputs.bootstrapWithToken && secrets.NPM_TOKEN || '' }}
    with:
      nodeVersion: '24'
      npmVersion: '12.0.2'
      packageVersion: ${{ github.event.release.tag_name || inputs.packageVersion }}
      workspaces: true
      bootstrapWithToken: ${{ inputs.bootstrapWithToken }}
  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-and-test
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
