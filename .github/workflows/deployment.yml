name: Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packageVersion:
        description: Bare semantic version to publish, for example 0.1.0
        required: true
        type: string
      bootstrapPackages:
        description: >-
          Unpublished npm packages authorized for one-time token bootstrap.
          Use comma-separated package names or * for the repository's first release.
        required: false
        type: string
        default: ''
      dryRun:
        description: Validate release preparation without publishing or deploying.
        required: false
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  publish-packages:
    name: Publish Packages
    needs: build-and-test
    uses: SchmiedmayerLab/.github/.github/workflows/npm-publish.yml@v0.4
    permissions:
      contents: read
      id-token: write
    with:
      packageVersion: ${{ github.event.release.tag_name || inputs.packageVersion }}
      bootstrapPackages: ${{ inputs.bootstrapPackages || '' }}
      dryRun: ${{ inputs.dryRun || false }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ !inputs.dryRun }}
    needs: build-and-test
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  create-release:
    name: Create GitHub Release
    if: >-
      always() &&
      !inputs.dryRun &&
      github.event_name == 'workflow_dispatch' &&
      needs.publish-packages.result == 'success'
    needs:
      - deploy-pages
      - publish-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.publish-packages.outputs.version }}
          PRERELEASE: ${{ needs.publish-packages.outputs.prerelease }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PACKAGE_VERSION" --jq .sha 2>/dev/null || true)"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
            echo "Tag $PACKAGE_VERSION points to $TAG_SHA instead of $RELEASE_SHA."
            exit 1
          fi

          if gh release view "$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $PACKAGE_VERSION already exists."
            exit 0
          fi

          ARGS=(
            "$PACKAGE_VERSION"
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_SHA"
            --title "$PACKAGE_VERSION"
            --generate-notes
          )
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release create "${ARGS[@]}"

  deployment:
    name: Deployment
    if: always()
    needs:
      - create-release
      - deploy-pages
      - publish-packages
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment jobs
        env:
          CREATE_RELEASE_RESULT: ${{ needs.create-release.result }}
          DEPLOY_PAGES_RESULT: ${{ needs.deploy-pages.result }}
          DRY_RUN: ${{ inputs.dryRun || false }}
          PUBLISH_RESULT: ${{ needs.publish-packages.result }}
        run: |
          if [ "$PUBLISH_RESULT" != "success" ]; then
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] &&
             [ "$DEPLOY_PAGES_RESULT" != "success" ]; then
            exit 1
          fi
          if [ "$CREATE_RELEASE_RESULT" != "success" ] &&
             [ "$CREATE_RELEASE_RESULT" != "skipped" ]; then
            exit 1
          fi
