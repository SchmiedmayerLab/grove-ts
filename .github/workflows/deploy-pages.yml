name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy to GitHub Pages
    uses: SchmiedmayerLab/.github/.github/workflows/npm-pages.yml@reusable-npm-workflows
    permissions:
      contents: read
      pages: write
      id-token: write
