version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  # Dependabot updates pnpm-lock.yaml through the npm ecosystem, including the documentation site workspace.
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # `typescript` stays TypeScript 6 for the tools that need its compiler API, such as typescript-eslint and TypeDoc.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # `@types/node` follows the oldest runtime in `engines.node`, not the development runtime in `.nvmrc`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
