version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # The typed linting stack currently supports TypeScript below 6.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Grove's supported runtime is Node.js 24.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /packages/design-system/docs
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
