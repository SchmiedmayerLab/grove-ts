packages:
  - packages/configurations
  - packages/design-system
  - packages/design-system/docs
  - packages/firebase-utils
  - packages/fhir
  - packages/firebase-cloud-messaging

# Only these dependencies may run install scripts.
allowBuilds:
  "@firebase/util": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  fsevents: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: true
  unrs-resolver: true
  core-js: true

# Wait seven days before installing newly published releases.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - nanoid

overrides:
  "@grpc/grpc-js": ^1.14.6
  glob: ^14.0.2
  # Documentation site build tooling.
  serialize-javascript: ^7.1.3
  sockjs>uuid: 11.1.1
  # Firebase Admin storage tooling; uuid below 11.1.1 is affected by GHSA-w5hq-g745-h8pq.
  teeny-request>uuid: 11.1.1
  tinypool: ^2.1.2

# Storybook's TypeScript docgen reads the TypeScript 6 compiler API.
# Its `typescript` peer would otherwise resolve to TypeScript 7, which pnpm installs for the missing peer.
packageExtensions:
  "@joshwooding/vite-plugin-react-docgen-typescript":
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2
  react-docgen-typescript:
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2
